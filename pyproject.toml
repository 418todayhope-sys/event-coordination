[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "event-planning-coordination-brief"
version = "0.1.0"
description = "Evidence-based event planning and coordination draft tooling."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "icalendar>=6,<7",
    "Jinja2>=3.1,<4",
    "jsonschema[format]>=4.23,<5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
event-coordination = "event_coordination.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

